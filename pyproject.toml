[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudguard"
version = "0.1.0"
description = "Serverless AWS misconfiguration scanner (EventBridge -> Lambda -> DynamoDB), all Terraform."
requires-python = ">=3.11"
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=7", "moto[all]>=5"]

[tool.setuptools.packages.find]
where = ["src"]
